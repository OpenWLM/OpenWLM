name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit des dépendances de production (vulnérabilités hautes ou critiques)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (client + serveur, no-undef)
        run: npm run lint

      - name: WAF Cloudflare — les règles sont-elles à jour ? (dérive des routes)
        run: npm run waf:check

      - name: Build
        run: npm run build

      - name: Tests unitaires + sécurité (serveur isolé, base de workspace éphémère)
        run: |
          # Les tests lisent le secret JWT dans le fichier .jwt_secret pour signer leurs tokens :
          # on écrit donc le même secret d'env dans le fichier, sinon les tokens seraient invalides.
          JWT_SECRET=$(openssl rand -hex 32)
          printf '%s' "$JWT_SECRET" > .jwt_secret
          JWT_SECRET="$JWT_SECRET" PORT=3001 NODE_ENV=test node server/index.js &
          SRV=$!
          npx wait-on -t 30000 http://localhost:3001/api/push/status
          npm run test:unit
          kill "$SRV" 2>/dev/null || true

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (parcours client réel)
        run: npx playwright test

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
