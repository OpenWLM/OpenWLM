name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit des dépendances de production (vulnérabilités hautes ou critiques)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (client + serveur, no-undef)
        run: npm run lint

      - name: WAF Cloudflare — les règles sont-elles à jour ? (dérive des routes)
        run: npm run waf:check

      - name: Build
        run: npm run build

      - name: Tests unitaires + sécurité (serveur isolé, base de workspace éphémère)
        run: |
          # Les tests lisent le secret JWT dans le fichier .jwt_secret pour signer leurs tokens :
          # on écrit donc le même secret d'env dans le fichier, sinon les tokens seraient invalides.
          JWT_SECRET=$(openssl rand -hex 32)
          printf '%s' "$JWT_SECRET" > .jwt_secret
          JWT_SECRET="$JWT_SECRET" PORT=3001 NODE_ENV=test node server/index.js &
          SRV=$!
          npx wait-on -t 30000 http://localhost:3001/api/push/status
          npm run test:unit
          kill "$SRV" 2>/dev/null || true

      - name: Audit de sécurité (son propre serveur isolé)
        run: npm run test:security

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (parcours client réel)
        run: npx playwright test

      - name: Rapport Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # App Android : tests JVM (verrouillage, durée de sonnerie, noms de fichiers), lint Android et
  # compilation de l'APK de debug. Sans aucun secret : ni keystore (APK de publication signé
  # sur la machine de développement Android), ni google-services.json (Firebase non inclus).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: SDK Android (plateforme 36, build-tools 36.0.0)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Synchronisation Capacitor (page hors ligne, configuration)
        run: npx cap sync android

      - name: Tests JVM, lint Android et APK de debug
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug assembleDebug --console=plain

      - name: Rapports Android (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
